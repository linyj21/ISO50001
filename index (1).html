<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISO 50001 能源管理系統 自我測驗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eef2f1;
  --panel: #ffffff;
  --ink: #1d2a2e;
  --muted: #5f6f72;
  --line: #d3dcda;
  --accent: #2f7d6d;
  --accent-dark: #25665a;
  --accent-soft: #dcefe9;
  --wrong: #b5473a;
  --wrong-soft: #f6e1dd;
  --scenario: #f3f6f5;
  color-scheme: light;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  line-height: 1.7;
}

.wrap {
  max-width: 760px;
  margin: 0 auto;
  padding: 40px 16px 56px;
}

a { color: var(--accent-dark); }

h1 { font-size: 28px; line-height: 1.4; margin: 0 0 8px; }
h2 { font-size: 20px; line-height: 1.5; margin: 0 0 8px; }
p { margin: 0 0 12px; }

.lead { color: var(--muted); max-width: 36em; }

.back {
  display: inline-block;
  margin-bottom: 20px;
  font-size: 15px;
  text-decoration: none;
}
.back:hover { text-decoration: underline; }

/* ---------- 首頁 ---------- */
.site-head { margin-bottom: 28px; }

.choices {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 16px;
}

.card {
  display: flex;
  flex-direction: column;
  background: var(--panel);
  border: 1.5px solid var(--line);
  border-radius: 14px;
  padding: 24px 22px;
  color: inherit;
  text-decoration: none;
}
.card:hover { border-color: var(--accent); }
.card:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

.card p { color: var(--muted); }

.meta {
  margin: 4px 0 16px;
  padding: 0;
  list-style: none;
  font-size: 15px;
}
.meta li { padding: 2px 0; }
.meta span { color: var(--muted); display: inline-block; min-width: 4.5em; }

.status { font-size: 14px; color: var(--muted); margin-top: auto; padding-top: 8px; }
.status.done { color: var(--accent-dark); }

.card .btn { margin-top: 12px; align-self: flex-start; }

.site-foot {
  margin-top: 36px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
  font-size: 14px;
  color: var(--muted);
}

/* ---------- 單元列表 ---------- */
.units { display: grid; gap: 12px; margin-top: 20px; }
.unit {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 4px 16px;
  align-items: start;
}
.unit h2 { margin: 0; }
.unit .count { font-size: 15px; color: var(--muted); white-space: nowrap; }
.unit p, .unit .status { grid-column: 1 / -1; margin: 0; }

/* ---------- 說明頁與作答 ---------- */
.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 28px 24px;
}

.quiz-top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 12px;
  font-size: 14px;
  color: var(--muted);
}
.quiz-top .back { margin: 0; }

.progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.progress-bar { height: 100%; width: 0; background: var(--accent); transition: width .3s ease; }
.count-line { color: var(--muted); font-size: 14px; margin: 12px 0 8px; }

.scenario {
  background: var(--scenario);
  border-left: 4px solid var(--accent);
  border-radius: 6px;
  padding: 12px 16px;
  margin-bottom: 16px;
}
.scenario-label { font-size: 14px; color: var(--muted); display: block; }

.question { font-size: 20px; font-weight: 500; line-height: 1.55; margin: 0 0 18px; }

.options { display: grid; gap: 10px; }
.option {
  font: inherit;
  font-size: 16px;
  text-align: left;
  line-height: 1.55;
  padding: 13px 16px;
  background: var(--panel);
  color: var(--ink);
  border: 1.5px solid var(--line);
  border-radius: 10px;
  cursor: pointer;
}
.option:hover:not(:disabled) { border-color: var(--accent); }
.option:disabled { cursor: default; }
.option.correct { border-color: var(--accent); background: var(--accent-soft); }
.option.wrong { border-color: var(--wrong); background: var(--wrong-soft); }

.feedback {
  margin-top: 16px;
  padding: 14px 16px;
  border-radius: 10px;
  background: var(--scenario);
}
.feedback strong { display: block; margin-bottom: 4px; }
.feedback .ok { color: var(--accent-dark); }
.feedback .ng { color: var(--wrong); }
.clause { font-size: 14px; color: var(--muted); margin: 6px 0 0; }

.btn {
  display: inline-block;
  font: inherit;
  font-weight: 500;
  font-size: 16px;
  padding: 11px 22px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  text-decoration: none;
}
.btn:hover { background: var(--accent-dark); }
.btn.secondary { background: transparent; color: var(--accent-dark); border: 1.5px solid var(--accent); }
.btn.secondary:hover { background: var(--accent-soft); }

.option:focus-visible, .btn:focus-visible, .back:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}

.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }

/* ---------- 結果 ---------- */
.score { font-size: 52px; font-weight: 700; color: var(--accent); line-height: 1.2; margin: 8px 0; }
.score small { font-size: 20px; color: var(--muted); font-weight: 500; margin-left: 8px; }

.review { list-style: none; padding: 0; margin: 24px 0 0; }
.review li { padding: 12px 0; border-top: 1px solid var(--line); font-size: 15px; }
.review .mark { font-weight: 700; margin-right: 6px; }
.review .mark.ok { color: var(--accent-dark); }
.review .mark.ng { color: var(--wrong); }
.review .detail { color: var(--muted); display: block; margin-top: 2px; }

@media (max-width: 480px) {
  .wrap { padding-top: 24px; }
  h1 { font-size: 24px; }
  .panel { padding: 22px 18px; }
  .question { font-size: 18px; }
}

@media (prefers-reduced-motion: reduce) {
  .progress-bar { transition: none; }
}

/* ---------- 考試模式：已選擇 ---------- */
.option.selected { border-color: var(--accent); background: var(--accent-soft); font-weight: 500; }

/* ---------- 結果：分數與錯誤說明 ---------- */
.tally { font-size: 17px; margin-bottom: 4px; }
.tally .ok, .answers .ok { color: var(--accent-dark); }
.tally .ng, .answers .ng { color: var(--wrong); }

.result-section { margin-top: 16px; }
.result-section h2 { margin-bottom: 12px; }
.all-right { color: var(--accent-dark); margin: 0; }

.wrong-list { list-style: none; padding: 0; margin: 0; }
.wrong-item { padding: 16px 0; border-top: 1px solid var(--line); }
.wrong-item:first-child { border-top: none; padding-top: 4px; }
.wrong-no { font-size: 14px; color: var(--muted); margin-bottom: 4px; }
.wrong-no span { margin-left: 10px; padding: 1px 8px; border-radius: 4px; background: var(--scenario); }
.wrong-scenario { font-size: 15px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 10px; }
.wrong-q { font-weight: 500; margin-bottom: 8px; }

.answers { margin: 0 0 8px; display: grid; gap: 4px; }
.answers div { display: flex; gap: 10px; }
.answers dt { flex: 0 0 4.5em; color: var(--muted); font-size: 15px; }
.answers dd { margin: 0; }

.explain { background: var(--scenario); border-radius: 8px; padding: 10px 14px; margin: 0; font-size: 15px; }
.explain strong { display: block; font-size: 14px; color: var(--muted); font-weight: 500; }

details summary { cursor: pointer; font-weight: 500; color: var(--accent-dark); }
details summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
details .review { margin-top: 12px; }

/* ---------- 稽核模擬 ---------- */
h2.sub { font-size: 18px; color: var(--accent-dark); margin: 26px 0 10px; }

.steps { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; font-size: 13px; }
.step { padding: 3px 10px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); }
.step.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.step.done { background: var(--accent-soft); border-color: var(--accent-soft); color: var(--accent-dark); }

.pick-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; margin-top: 8px; }
.pick { display: block; border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; }
.pick:hover { border-color: var(--accent); background: var(--scenario); }
.pick input { margin-right: 8px; accent-color: var(--accent); }
.pick strong { font-weight: 500; }
.pick small { display: block; color: var(--muted); margin: 2px 0 6px; line-height: 1.5; }
.pick:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }

.clause-tag { display: inline-block; background: var(--accent-soft); color: var(--accent-dark); padding: 1px 10px; border-radius: 12px; font-size: 13px; }
.section-tag { display: inline-block; background: var(--accent); color: #fff; padding: 2px 12px; border-radius: 12px; font-size: 13px; margin: 0 6px 6px 0; }

table.info { width: 100%; border-collapse: collapse; font-size: 15px; }
table.info th, table.info td { border-bottom: 1px solid var(--line); padding: 9px 8px; text-align: left; vertical-align: top; }
table.info th { color: var(--muted); font-weight: 500; width: 36%; }

.scenario.warn { background: #fbf3de; border-left-color: #c9a227; }

.doc { border: 1px solid var(--line); border-radius: 10px; margin: 10px 0; overflow: hidden; }
.doc-title { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; font: inherit; font-weight: 500; text-align: left; padding: 12px 16px; background: var(--scenario); color: var(--ink); border: none; cursor: pointer; }
.doc-title span { font-size: 13px; color: var(--muted); font-weight: 400; }
.doc-title:hover { background: var(--accent-soft); }
.doc-content { padding: 14px 16px; display: none; font-size: 15px; }
.doc.open .doc-content { display: block; }

.dialogue { padding: 11px 15px; border-radius: 10px; margin: 8px 0; font-size: 15px; }
.dialogue strong { display: block; font-size: 13px; color: var(--muted); font-weight: 500; }
.dialogue.auditor { background: #e9f0f7; }
.dialogue.employee { background: var(--accent-soft); }

.a-q { border-top: 1px solid var(--line); padding: 18px 0 6px; }
.a-q .question { font-size: 17px; margin: 8px 0 12px; }
.a-option { display: flex; gap: 10px; align-items: flex-start; padding: 11px 14px; border: 1.5px solid var(--line); border-radius: 10px; margin: 8px 0; cursor: pointer; line-height: 1.55; }
.a-option:hover { border-color: var(--accent); }
.a-option input { margin-top: 5px; accent-color: var(--accent); }
.a-option:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }

.cat-row { margin: 16px 0; }
.cat-row .num { float: right; color: var(--muted); font-size: 15px; }

.a-review { border-left: 4px solid var(--accent); background: var(--scenario); border-radius: 0 10px 10px 0; padding: 14px 16px; margin: 14px 0; }
.a-review.wrong { border-left-color: var(--wrong); background: #f9eceb; }
.a-review .wrong-q { margin-bottom: 10px; }
.explain.tip { background: #fbf3de; margin-top: 8px; }

/* ---------- 行業別選擇 ---------- */
.industry-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-top: 12px; }
.industry { font: inherit; font-weight: 500; font-size: 16px; text-align: center; padding: 20px 10px; background: var(--panel); color: var(--ink); border: 1.5px solid var(--line); border-radius: 12px; cursor: pointer; }
.industry:hover { border-color: var(--accent); background: var(--scenario); }
.industry.selected { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-dark); }
.industry-icon { display: block; font-size: 30px; margin-bottom: 6px; }
.cat-row .muted { color: var(--muted); }
.panel .lead { margin-top: 0; }

/* ---------- 進階版：情境與文件表格 ---------- */
.card h2 .level { font-size: 13px; font-weight: 500; background: var(--accent-soft); color: var(--accent-dark); padding: 2px 10px; border-radius: 12px; margin-left: 8px; vertical-align: middle; }

.context { background: var(--scenario); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin: 10px 0 12px; font-size: 15px; }
.a-review .context { background: #fff; }

.doc-meta { background: var(--scenario); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; margin-bottom: 12px; font-size: 14px; color: var(--muted); }
.doc-content { overflow-x: auto; }
.doc-table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 14px; }
.doc-table th, .doc-table td { border: 1px solid var(--line); padding: 8px 9px; text-align: left; white-space: nowrap; }
.doc-table th { background: var(--scenario); font-weight: 500; }
.doc-content p { font-size: 15px; }

.explain.evidence { background: #e9f0f7; margin-top: 8px; }
.explain.thinking { background: #f2f0fa; margin-top: 8px; }
h1 .level { font-size: 14px; font-weight: 500; background: var(--accent-soft); color: var(--accent-dark); padding: 3px 12px; border-radius: 12px; margin-left: 10px; vertical-align: middle; }

</style>
</head>
<body>
<main id="app" class="wrap"></main>

<script>
/* ==========================================================
   資料區：要修改題目或內容，改這一段就好
   ========================================================== */
// ============================================
// 網站共用文字設定（首頁標題、頁尾等）
// ============================================
const SITE = {
  title: "ISO 50001 能源管理系統 自我測驗",
  intro: "依據 ISO 50001:2018，供內部訓練使用。",
  footer: "本測驗內容為訓練用摘要與情境設計，並非標準原文，條文要求請以正式標準為準。",

  // 是否在作答者自己的瀏覽器記住練習紀錄（不會上傳到任何地方）
  rememberProgress: true,

  // 結果頁評語：依分數（100 分制）由高到低判斷
  comments: [
    { min: 90, text: "非常熟悉，掌握得很好。" },
    { min: 70, text: "大致掌握，建議回顧下方答錯的題目。" },
    { min: 0,  text: "建議再複習相關條文後重新測驗。" }
  ]
};
// ============================================
// 條文架構測驗題庫（共 100 題）
// answer：正確答案在 options 中的位置，從 0 開始算
// clause 開頭的數字會自動當作章節，用來分配抽題
// 「4～10」這類跨章題目會歸在「綜合」
// ============================================
const iso50001Questions = [

/* ========== 第4章 組織處境 ========== */
{ id: 1, clause: "4.1", clauseName: "瞭解組織及其處境",
  question: "組織建立能源管理系統時，首先應瞭解哪些可能影響能源管理系統預期結果的因素？",
  options: ["僅能源價格", "內部與外部議題", "僅政府法規", "僅設備使用年限"], answer: 1,
  explanation: "4.1要求組織確認與其目的相關，且可能影響能源管理系統及能源績效的內部與外部議題。" },
{ id: 2, clause: "4.1", clauseName: "瞭解組織及其處境",
  question: "下列何者最可能屬於影響能源管理系統的外部議題？",
  options: ["設備操作方式", "員工能源管理能力", "政府能源政策變化", "內部組織調整"], answer: 2,
  explanation: "政府政策、能源市場及外部環境變化均可能屬於外部議題。" },
{ id: 3, clause: "4.1", clauseName: "瞭解組織及其處境",
  question: "下列何者較可能屬於能源管理系統的內部議題？",
  options: ["國際能源價格", "政府能源政策", "廠內設備老舊", "國家能源法規"], answer: 2,
  explanation: "設備狀況、組織能力、內部資源等通常屬於內部議題。" },
{ id: 4, clause: "4.2", clauseName: "瞭解利害相關者的需求與期望",
  question: "組織應確認哪些利害相關者與能源管理系統有關，主要目的為何？",
  options: ["增加文件數量", "瞭解相關需求及要求", "決定設備品牌", "計算員工人數"], answer: 1,
  explanation: "應確認與EnMS及能源績效有關的利害相關者，以及其相關需求與期望。" },
{ id: 5, clause: "4.2", clauseName: "瞭解利害相關者的需求與期望",
  question: "下列何者可能是能源管理系統的利害相關者？",
  options: ["主管機關", "客戶", "能源供應商", "以上皆是"], answer: 3,
  explanation: "主管機關、客戶及能源供應商皆可能對組織能源管理產生相關要求。" },
{ id: 6, clause: "4.2", clauseName: "瞭解利害相關者的需求與期望",
  question: "組織對能源相關法令要求應採取何種作法？",
  options: ["只有驗證前確認", "確認並取得適用要求", "完全交由驗證公司判斷", "只有發生違規時處理"], answer: 1,
  explanation: "組織需確認與能源效率、能源使用及能源消耗相關的適用法令及其他要求。" },
{ id: 7, clause: "4.3", clauseName: "決定能源管理系統範疇",
  question: "決定能源管理系統範疇與邊界時，下列何者應納入考量？",
  options: ["內外部議題", "利害相關者相關要求", "組織可控制的活動與能源使用", "以上皆是"], answer: 3,
  explanation: "EnMS範疇需考量組織處境、相關要求以及組織對能源使用與能源績效的控制能力。" },
{ id: 8, clause: "4.3", clauseName: "決定能源管理系統範疇",
  question: "能源管理系統的範疇與邊界應如何處理？",
  options: ["只需口頭說明", "應予以建立並維持相關資訊", "完全由驗證機構決定", "每月重新制定"], answer: 1,
  explanation: "組織應確定EnMS的範疇及邊界，並維持其文件化資訊。" },
{ id: 9, clause: "4.3", clauseName: "決定能源管理系統範疇",
  question: "某工廠將高耗能製程任意排除在能源管理系統範圍之外，最可能涉及哪一條文？",
  options: ["4.3", "5.2", "7.2", "9.2"], answer: 0,
  explanation: "能源管理系統範疇及邊界的合理性屬於4.3要求。" },
{ id: 10, clause: "4.4", clauseName: "能源管理系統",
  question: "ISO 50001要求組織建立能源管理系統的核心目的之一為何？",

  explanation: "能源管理系統的重要目的之一是持續改善能源績效。" },

/* ========== 第5章 領導 ========== */
{ id: 11, clause: "5.1", clauseName: "領導與承諾",
  question: "能源管理系統最終的領導責任主要由誰承擔？",
  options: ["能源管理人員", "外部顧問", "最高管理階層", "驗證機構"], answer: 2,

{ id: 12, clause: "5.1", clauseName: "領導與承諾",
  question: "最高管理階層應確保能源管理系統所需資源如何取得？",
  options: ["只有驗證前提供", "依需求提供必要資源", "由員工自行負擔", "完全交由顧問處理"], answer: 1,
  explanation: "最高管理階層應確保建立、實施、維持及改善EnMS所需資源可以取得。" },

// 首頁顯示的稽核模擬版本（順序即首頁排列順序）
const AUDIT_SETS = [AUDIT_BASIC, AUDIT_ADV];


/* ==========================================================
   程式區：一般不需要修改
   ========================================================== */
// ============================================
// 主程式：頁面切換、抽題、作答、結果
// 修改題目請找上方的 SITE / CLAUSE_QUIZ / iso50001Questions / AUDIT_SIM
// ============================================
(function () {
  const app = document.getElementById("app");
  const STORE_KEY = "iso50001-progress-v1";

  // ---------- 工具 ----------
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function commentFor(points) {
    const found = SITE.comments.find(c => points >= c.min);
    return found ? found.text : "";
  }

  function chapterOf(q) {
    if (q.chapter != null) return String(q.chapter);
    const clause = String(q.clause || "");
    if (/[～~]/.test(clause)) return "綜合";
    const m = clause.match(/^(\d+)/);
    return m ? m[1] : "綜合";
  }

  function clauseText(q) {
    if (!q.clause) return "";
    return q.clauseName ? q.clause + " " + q.clauseName : q.clause;
  }

  function scrollTop() { window.scrollTo(0, 0); }

  // ---------- 練習紀錄（只存在作答者自己的瀏覽器） ----------
  function loadProgress() {
    if (!SITE.rememberProgress) return {};
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
    catch (e) { return {}; }
  }

  function saveProgress(key, points) {
    if (!SITE.rememberProgress) return;
    try {
      const all = loadProgress();
      const prev = all[key] || { best: 0, attempts: 0 };
      all[key] = { best: Math.max(prev.best, points), attempts: prev.attempts + 1 };
      localStorage.setItem(STORE_KEY, JSON.stringify(all));
    } catch (e) { /* 瀏覽器不允許儲存時略過 */ }
  }

  function statusHTML(key) {
    if (!SITE.rememberProgress) return "";
    const p = loadProgress()[key];
    if (!p) return `<div class="status">尚未練習</div>`;
    return `<div class="status done">已練習 ${p.attempts} 次，最佳 ${p.best} 分</div>`;
  }

  // ============================================
  // 首頁
  // ============================================
  function showHome() {
    document.title = SITE.title;
    const clauseCount = Math.min(CLAUSE_QUIZ.questionCount, CLAUSE_QUIZ.bank.length);

    app.innerHTML = `
      <header class="site-head">
        <h1>${esc(SITE.title)}</h1>
        <p class="lead">${esc(SITE.intro)}</p>
      </header>

      <div class="choices">
        <a class="card" href="#/clauses">
          <h2>${esc(CLAUSE_QUIZ.title)}</h2>
          <p>${esc(CLAUSE_QUIZ.description)}</p>
          <ul class="meta">
            <li><span>適合對象</span>${esc(CLAUSE_QUIZ.audience)}</li>
            <li><span>出題方式</span>從 ${CLAUSE_QUIZ.bank.length} 題中隨機抽 ${clauseCount} 題</li>
          </ul>
          ${statusHTML("clauses")}
          <span class="btn">開始測驗</span>
        </a>

        ${AUDIT_SETS.map(set => `
          <a class="card" href="#/${esc(set.id)}">
            <h2>${esc(set.title)}${set.level ? `<span class="level">${esc(set.level)}</span>` : ""}</h2>
            <p>${esc(set.description)}</p>
            <ul class="meta">
              <li><span>適合對象</span>${esc(set.audience)}</li>
              <li><span>模擬情境</span>${set.industries.length} 種行業別可選</li>
              <li><span>出題方式</span>依負責項目出題，共 ${set.responsibilities.length} 個項目 ${set.questions.length} 題</li>
            </ul>
            ${statusHTML(set.id)}
            <span class="btn">開始模擬</span>
          </a>`).join("")}
      </div>

      <footer class="site-foot">${esc(SITE.footer)}</footer>`;
  }

  // ============================================
  // 條文架構測驗
  // ============================================
  function showClauseIntro() {
    document.title = CLAUSE_QUIZ.title + "｜" + SITE.title;
    const count = Math.min(CLAUSE_QUIZ.questionCount, CLAUSE_QUIZ.bank.length);
    const groups = new Set(CLAUSE_QUIZ.bank.map(chapterOf)).size;
    const quotaText = CLAUSE_QUIZ.minPerChapter > 0
      ? `每個章節至少 ${CLAUSE_QUIZ.minPerChapter} 題，其餘隨機`
      : "完全隨機";
    const modeText = CLAUSE_QUIZ.feedbackMode === "end"
      ? "作答過程不顯示對錯，全部完成後公布分數與錯誤說明"
      : "每題作答後立即顯示對錯與說明";

    app.innerHTML = `
      <a class="back" href="#/">← 回首頁</a>
      <div class="panel">
        <h1>${esc(CLAUSE_QUIZ.title)}</h1>
        <p>${esc(CLAUSE_QUIZ.description)}</p>
        <ul class="meta">
          <li><span>題庫</span>共 ${CLAUSE_QUIZ.bank.length} 題，分為 ${groups} 個章節分類</li>
          <li><span>本次題數</span>${count} 題，滿分 100 分</li>
          <li><span>抽題方式</span>${quotaText}</li>
          <li><span>作答方式</span>${modeText}</li>
        </ul>
        ${statusHTML("clauses")}
        <div class="actions"><button class="btn" id="start">開始作答</button></div>
      </div>`;

    document.getElementById("start").onclick = startClauseQuiz;
  }

  function pickClauseQuestions() {
    const bank = CLAUSE_QUIZ.bank;
    const count = Math.min(CLAUSE_QUIZ.questionCount, bank.length);
    let picked = [];

    if (CLAUSE_QUIZ.minPerChapter > 0) {
      const groups = {};
      bank.forEach(q => {
        const ch = chapterOf(q);
        if (!groups[ch]) groups[ch] = [];
        groups[ch].push(q);
      });
      shuffle(Object.keys(groups)).forEach(ch => {
        shuffle(groups[ch]).slice(0, CLAUSE_QUIZ.minPerChapter).forEach(q => {
          if (picked.length < count) picked.push(q);
        });
      });
    }

    const rest = shuffle(bank.filter(q => !picked.includes(q)));
    picked = picked.concat(rest.slice(0, count - picked.length));
    return shuffle(picked);
  }

  function startClauseQuiz() {
    runQuiz({
      label: CLAUSE_QUIZ.title,
      questions: pickClauseQuestions(),
      shuffleOptions: CLAUSE_QUIZ.shuffleOptions,
      feedbackMode: CLAUSE_QUIZ.feedbackMode,
      exitHash: "#/clauses",
      storeKey: "clauses",
      retryText: "重新抽題測驗",
      onRetry: startClauseQuiz,
      afterLinks: `<a class="btn secondary" href="#/">回首頁</a>`
    });
  }

  function runQuiz(cfg) {
    const instant = cfg.feedbackMode !== "end";

    const qs = cfg.questions.map(q => {
      let opts = q.options.map((text, i) => ({ text, correct: i === q.answer }));
      const hasAbove = q.options.some(t => /^以上/.test(t)); // 含「以上皆是」時不打亂
      if (cfg.shuffleOptions && !hasAbove) opts = shuffle(opts);
      return Object.assign({}, q, { opts });
    });

    let current = 0;
    const picks = [];

    function renderQuestion() {
      const q = qs[current];
      const isLast = current === qs.length - 1;

      app.innerHTML = `
        <div class="panel">
          <div class="quiz-top">
            <a class="back" href="${cfg.exitHash}" id="exit">← 離開測驗</a>
            <span>${esc(cfg.label)}</span>
          </div>
          <div class="progress"><div class="progress-bar" id="bar"></div></div>
          <div class="count-line">第 ${current + 1} 題 / 共 ${qs.length} 題</div>
          ${q.scenario ? `<div class="scenario"><span class="scenario-label">情境</span>${esc(q.scenario)}</div>` : ""}
          <p class="question">${esc(q.question)}</p>
          <div class="options">
            ${q.opts.map((o, i) => `<button class="option" data-i="${i}">${esc(o.text)}</button>`).join("")}
          </div>
          <div id="feedback"></div>
          <div class="actions"><button class="btn" id="next" hidden>${isLast ? (instant ? "看結果" : "交卷看成績") : "下一題"}</button></div>
        </div>`;

      const bar = document.getElementById("bar");
      setTimeout(() => { bar.style.width = (current / qs.length * 100) + "%"; }, 10);

      document.getElementById("exit").onclick = e => {
        if (!confirm("確定要離開嗎？這次作答不會保留。")) e.preventDefault();
      };

      app.querySelectorAll(".option").forEach(btn => {
        btn.onclick = () => choose(Number(btn.dataset.i));
      });

      document.getElementById("next").onclick = () => {
        current++;
        if (current < qs.length) renderQuestion();
        else renderResult();
        scrollTop();
      };
    }

    function choose(i) {
      const q = qs[current];
      const buttons = app.querySelectorAll(".option");
      picks[current] = { index: i, text: q.opts[i].text, right: q.opts[i].correct };
      const next = document.getElementById("next");

      if (!instant) {
        buttons.forEach((b, idx) => b.classList.toggle("selected", idx === i));
        next.hidden = false;
        return;
      }

      const right = q.opts[i].correct;
      const correctText = q.opts.find(o => o.correct).text;
      buttons.forEach((b, idx) => {
        b.disabled = true;
        if (q.opts[idx].correct) b.classList.add("correct");
        else if (idx === i) b.classList.add("wrong");
      });

      document.getElementById("feedback").innerHTML = `
        <div class="feedback">
          <strong class="${right ? "ok" : "ng"}">${right ? "答對了" : "答錯了，正確答案是「" + esc(correctText) + "」"}</strong>
          ${esc(q.explanation)}
          ${q.clause ? `<p class="clause">相關條文：${esc(clauseText(q))}</p>` : ""}
        </div>`;

      next.hidden = false;
      next.focus();
    }

    function renderResult() {
      const total = qs.length;
      const correct = picks.filter(p => p && p.right).length;
      const points = Math.round(correct / total * 100);
      saveProgress(cfg.storeKey, points);

      const wrongItems = qs.map((q, idx) => ({ q, idx, p: picks[idx] })).filter(x => !x.p.right);

      const wrongHTML = wrongItems.length === 0
        ? `<p class="all-right">全部答對，沒有錯誤題目。</p>`
        : `<ol class="wrong-list">
            ${wrongItems.map(({ q, idx, p }) => `
              <li class="wrong-item">
                <div class="wrong-no">第 ${idx + 1} 題${q.clause ? `<span>${esc(clauseText(q))}</span>` : ""}</div>
                ${q.scenario ? `<p class="wrong-scenario">${esc(q.scenario)}</p>` : ""}
                <p class="wrong-q">${esc(q.question)}</p>
                <dl class="answers">
                  <div><dt>你的答案</dt><dd class="ng">${esc(p.text)}</dd></div>
                  <div><dt>正確答案</dt><dd class="ok">${esc(q.opts.find(o => o.correct).text)}</dd></div>
                </dl>
                <p class="explain"><strong>說明</strong>${esc(q.explanation)}</p>
              </li>`).join("")}
          </ol>`;

      app.innerHTML = `
        <div class="panel">
          <div class="progress"><div class="progress-bar" style="width:100%"></div></div>
          <h1 style="margin-top:20px">${esc(cfg.label)}：測驗結果</h1>
          <div class="score">${points}<small>分</small></div>
          <p class="tally">答對 <b class="ok">${correct}</b> 題，答錯 <b class="ng">${total - correct}</b> 題，共 ${total} 題</p>
          <p>${esc(commentFor(points))}</p>
          <div class="actions">
            <button class="btn" id="retry">${esc(cfg.retryText)}</button>
            ${cfg.afterLinks}
          </div>
        </div>

        <section class="panel result-section">
          <h2>錯誤題目說明${wrongItems.length ? `（${wrongItems.length} 題）` : ""}</h2>
          ${wrongHTML}
        </section>

        <section class="panel result-section">
          <details>
            <summary>查看全部 ${total} 題作答情形</summary>
            <ul class="review">
              ${qs.map((q, idx) => `
                <li>
                  <span class="mark ${picks[idx].right ? "ok" : "ng"}">${picks[idx].right ? "✓" : "✗"}</span>${idx + 1}. ${esc(q.question)}
                  <span class="detail">正確答案：${esc(q.opts.find(o => o.correct).text)}${q.clause ? "｜" + esc(clauseText(q)) : ""}</span>
                </li>`).join("")}
            </ul>
          </details>
        </section>`;

      document.getElementById("retry").onclick = () => { cfg.onRetry(); scrollTop(); };
    }

    renderQuestion();
  }

  // ============================================
  // 內部稽核模擬測驗
  // ============================================
  const audit = { set: null, industry: null, selected: [], questions: [], answers: {} };

  function findResp(id) {
    return audit.set.responsibilities.find(r => r.id === id);
  }

  function findIndustry(id) {
    return audit.set.industries.find(i => i.id === id);
  }

  const STEP_NAMES = ["行業別", "負責項目", "組織背景", "文件審查", "訪談", "稽核測驗", "結果"];

  function stepBar(n) {
    return `<div class="steps">${STEP_NAMES.map((name, i) =>
      `<span class="step${i + 1 === n ? " on" : ""}${i + 1 < n ? " done" : ""}">${i + 1} ${name}</span>`).join("")}</div>`;
  }

  function startAudit(set) {
    if (!audit.set || audit.set.id !== set.id) {
      audit.set = set;
      audit.industry = null;
      audit.selected = [];
      audit.answers = {};
    }
    showAuditStep1();
  }

  function auditHead(step) {
    return `<a class="back" href="#/">← 回首頁</a>${stepBar(step)}`;
  }

  // ---------- STEP 1 行業別 ----------
  function showAuditStep1() {
    const set = audit.set;
    document.title = set.title + "｜" + SITE.title;
    app.innerHTML = `
      ${auditHead(1)}
      <div class="panel">
        <h1>${esc(set.title)}<span class="level">${esc(set.level)}</span></h1>
        <p>${esc(set.description)}</p>
        <h2 class="sub">選擇模擬行業別</h2>
        <p class="lead">不同產業會顯示不同的主要製程、能源設備及重大能源使用（SEU）。</p>
        <div class="scenario"><span class="scenario-label">說明</span>${esc(set.notes.start)}</div>
        ${statusHTML(set.id)}
        <div class="industry-grid">
          ${set.industries.map(i => `
            <button type="button" class="industry${audit.industry === i.id ? " selected" : ""}" data-id="${esc(i.id)}">
              <span class="industry-icon">${i.icon}</span>${esc(i.name)}
            </button>`).join("")}
        </div>
        <div class="actions"><button class="btn" id="go">下一步 →</button></div>
      </div>`;

    app.querySelectorAll(".industry").forEach(btn => {
      btn.onclick = () => {
        audit.industry = btn.dataset.id;
        app.querySelectorAll(".industry").forEach(b => b.classList.toggle("selected", b === btn));
      };
    });

    document.getElementById("go").onclick = () => {
      if (!audit.industry) { alert("請先選擇一個模擬行業別"); return; }
      showAuditStep2();
      scrollTop();
    };
  }

  // ---------- STEP 2 負責項目 ----------
  function showAuditStep2() {
    app.innerHTML = `
      ${auditHead(2)}
      <div class="panel">
        <h1>選擇您的負責項目</h1>
        <p>請依實際工作內容選擇，可複選。測驗會依您選擇的項目分區出題。</p>
        <div class="pick-grid">
          ${audit.set.responsibilities.map(r => `
            <label class="pick">
              <input type="checkbox" value="${esc(r.id)}" ${audit.selected.includes(r.id) ? "checked" : ""}>
              <strong>${esc(r.name)}</strong>
              <small>${esc(r.description)}</small>
              <span class="clause-tag">ISO 50001 ${esc(r.clauses)}</span>
            </label>`).join("")}
        </div>
        <div class="actions">
          <button class="btn secondary" id="back">← 返回</button>
          <button class="btn secondary" id="all">全選</button>
          <button class="btn" id="go">開始模擬 →</button>
        </div>
      </div>`;

    document.getElementById("all").onclick = () => {
      const boxes = app.querySelectorAll(".pick input");
      const allOn = [...boxes].every(b => b.checked);
      boxes.forEach(b => { b.checked = !allOn; });
    };
    document.getElementById("back").onclick = () => { showAuditStep1(); scrollTop(); };
    document.getElementById("go").onclick = () => {
      audit.selected = [...app.querySelectorAll(".pick input:checked")].map(b => b.value);
      if (audit.selected.length === 0) { alert("請至少選擇一項負責項目"); return; }
      audit.answers = {};
      showAuditStep3();
      scrollTop();
    };
  }

  // ---------- STEP 3 組織背景 ----------
  function showAuditStep3() {
    const set = audit.set;
    const ind = findIndustry(audit.industry);
    const rows = [
      ["行業別", ind.name],
      ["員工人數", set.company.employees],
      ["主要製程", ind.process],
      ["主要能源", ind.energy],
      ["主要能源設備", ind.equipment],
      ["重大能源使用（SEU）", ind.seu]
    ].concat(set.company.extraRows || []);

    app.innerHTML = `
      ${auditHead(3)}
      <div class="panel">
        <h1>模擬組織背景</h1>
        <h2 class="sub">${ind.icon} ${esc(ind.company)}</h2>
        <table class="info"><tbody>
          ${rows.map(r => `<tr><th>${esc(r[0])}</th><td>${esc(r[1])}</td></tr>`).join("")}
        </tbody></table>
        <div class="scenario warn"><span class="scenario-label">稽核背景</span>${esc(set.company.situation)}</div>
        <h2 class="sub">本次稽核項目</h2>
        <div>${audit.selected.map(id => `<span class="section-tag">${esc(findResp(id).name)}</span>`).join("")}</div>
        <div class="actions">
          <button class="btn secondary" id="back">← 返回</button>
          <button class="btn" id="go">開始文件審查 →</button>
        </div>
      </div>`;
    document.getElementById("back").onclick = () => { showAuditStep2(); scrollTop(); };
    document.getElementById("go").onclick = () => { showAuditStep4(); scrollTop(); };
  }

  // ---------- STEP 4 文件 ----------
  function showAuditStep4() {
    const set = audit.set;
    app.innerHTML = `
      ${auditHead(4)}
      <div class="panel">
        <h1>文件審查</h1>
        <div class="scenario"><span class="scenario-label">稽核提示</span>${esc(set.notes.docs)}</div>
        ${audit.selected.map(id => {
          const doc = set.documents[id];
          if (!doc) return "";
          return `
            <div class="doc">
              <button class="doc-title" type="button">📄 ${esc(findResp(id).name)}｜${esc(doc.title)}<span>展開</span></button>
              <div class="doc-content">${doc.content}</div>
            </div>`;
        }).join("")}
        <div class="actions">
          <button class="btn secondary" id="back">← 返回</button>
          <button class="btn" id="go">進行人員訪談 →</button>
        </div>
      </div>`;

    app.querySelectorAll(".doc-title").forEach(btn => {
      btn.onclick = () => {
        const doc = btn.parentElement;
        doc.classList.toggle("open");
        btn.querySelector("span").textContent = doc.classList.contains("open") ? "收合" : "展開";
      };
    });
    document.getElementById("back").onclick = () => { showAuditStep3(); scrollTop(); };
    document.getElementById("go").onclick = () => { showAuditStep5(); scrollTop(); };
  }

  // ---------- STEP 5 訪談 ----------
  function showAuditStep5() {
    const set = audit.set;
    app.innerHTML = `
      ${auditHead(5)}
      <div class="panel">
        <h1>人員訪談</h1>
        <p>請將訪談內容與前一頁的文件交叉比對，部分回答可能合理，也可能透露文件與實際執行不一致。</p>
        ${audit.selected.map(id => {
          const lines = set.interviews[id];
          if (!lines) return "";
          const r = findResp(id);
          return `<h2 class="sub">${esc(r.name)} <span class="clause-tag">ISO 50001 ${esc(r.clauses)}</span></h2>` +
            lines.map(l => `
              <div class="dialogue ${l[0] === "稽核員" ? "auditor" : "employee"}">
                <strong>${esc(l[0])}</strong>${esc(l[1])}
              </div>`).join("");
        }).join("")}
        <div class="actions">
          <button class="btn secondary" id="back">← 返回</button>
          <button class="btn" id="go">開始稽核測驗 →</button>
        </div>
      </div>`;
    document.getElementById("back").onclick = () => { showAuditStep4(); scrollTop(); };
    document.getElementById("go").onclick = () => { showAuditStep6(); scrollTop(); };
  }

  // ---------- STEP 6 測驗 ----------
  function showAuditStep6() {
    const set = audit.set;
    audit.questions = set.questions.filter(q => audit.selected.includes(q.category));

    app.innerHTML = `
      ${auditHead(6)}
      <div class="panel">
        <h1>${esc(set.title)}<span class="level">${esc(set.level)}</span></h1>
        <div class="scenario"><span class="scenario-label">作答說明</span>${esc(set.notes.quiz)}共 ${audit.questions.length} 題。</div>
        ${audit.selected.map(cat => {
          const list = audit.questions.filter(q => q.category === cat);
          if (!list.length) return "";
          const r = findResp(cat);
          return `<h2 class="sub">${esc(r.name)} <span class="clause-tag">主要對應 ISO 50001 ${esc(r.clauses)}</span></h2>` +
            list.map(q => `
              <div class="a-q">
                <span class="clause-tag">ISO 50001 ${esc(q.clause)}</span>
                ${q.context ? `<div class="context"><span class="scenario-label">稽核情境</span>${esc(q.context)}</div>` : ""}
                <p class="question">${esc(q.question)}</p>
                ${q.options.map((opt, i) => `
                  <label class="a-option">
                    <input type="radio" name="q${q.id}" value="${i}" ${audit.answers[q.id] === i ? "checked" : ""}>
                    <span>${String.fromCharCode(65 + i)}. ${esc(opt)}</span>
                  </label>`).join("")}
              </div>`).join("");
        }).join("")}
        <div class="actions">
          <button class="btn secondary" id="back">← 返回訪談</button>
          <button class="btn" id="submit">完成測驗，看成績</button>
        </div>
      </div>`;

    app.querySelectorAll('input[type="radio"]').forEach(r => {
      r.onchange = () => { audit.answers[Number(r.name.slice(1))] = Number(r.value); };
    });
    document.getElementById("back").onclick = () => { showAuditStep5(); scrollTop(); };
    document.getElementById("submit").onclick = () => {
      const unanswered = audit.questions.filter(q => audit.answers[q.id] == null).length;
      if (unanswered > 0 && !confirm(`尚有 ${unanswered} 題未作答，未作答將以答錯計算，是否仍要送出？`)) return;
      showAuditResult();
      scrollTop();
    };
  }

  // ---------- STEP 7 結果 ----------
  function showAuditResult() {
    const set = audit.set;
    const ind = findIndustry(audit.industry);
    const list = audit.questions;
    const total = list.length;
    let correct = 0;
    const byCat = {};

    list.forEach(q => {
      const right = audit.answers[q.id] === q.answer;
      if (!byCat[q.category]) byCat[q.category] = { total: 0, correct: 0 };
      byCat[q.category].total++;
      if (right) { correct++; byCat[q.category].correct++; }
    });

    const points = total ? Math.round(correct / total * 100) : 0;
    saveProgress(set.id, points);

    app.innerHTML = `
      ${auditHead(7)}
      <div class="panel">
        <h1>${esc(set.title)}<span class="level">${esc(set.level)}</span>：結果</h1>
        <div><span class="section-tag">${ind.icon} ${esc(ind.name)}</span></div>
        <p class="lead">${esc(ind.company)}</p>
        <div class="score">${points}<small>分</small></div>
        <p class="tally">答對 <b class="ok">${correct}</b> 題，答錯 <b class="ng">${total - correct}</b> 題，共 ${total} 題</p>
        <p>${esc(commentFor(points))}</p>
        <div class="actions">
          <button class="btn" id="again">換個行業再做一次</button>
          <a class="btn secondary" href="#/">回首頁</a>
        </div>
      </div>

      <section class="panel result-section">
        <h2>各負責項目結果</h2>
        ${Object.keys(byCat).map(id => {
          const d = byCat[id];
          const pct = Math.round(d.correct / d.total * 100);
          const r = findResp(id);
          return `
            <div class="cat-row">
              <strong>${esc(r.name)}</strong><span class="num">${d.correct}/${d.total}（${pct}%）</span>
              <div class="progress"><div class="progress-bar" style="width:${pct}%"></div></div>
              <small class="muted">對應條文：ISO 50001 ${esc(r.clauses)}</small>
            </div>`;
        }).join("")}
      </section>

      <section class="panel result-section">
        <h2>逐題正解與解析</h2>
        ${list.map((q, idx) => {
          const picked = audit.answers[q.id];
          const right = picked === q.answer;
          return `
            <div class="a-review${right ? "" : " wrong"}">
              <div class="wrong-no">第 ${idx + 1} 題　<span>${esc(findResp(q.category).name)}｜ISO 50001 ${esc(q.clause)}</span></div>
              ${q.context ? `<div class="context"><span class="scenario-label">原始情境</span>${esc(q.context)}</div>` : ""}
              <p class="wrong-q">${right ? '<b class="ok">✓ 答對</b>' : '<b class="ng">✕ 答錯</b>'}　${esc(q.question)}</p>
              <dl class="answers">
                <div><dt>你的答案</dt><dd class="${right ? "ok" : "ng"}">${picked == null ? "未作答" : String.fromCharCode(65 + picked) + ". " + esc(q.options[picked])}</dd></div>
                <div><dt>正確答案</dt><dd class="ok">${String.fromCharCode(65 + q.answer)}. ${esc(q.options[q.answer])}</dd></div>
              </dl>
              <p class="explain"><strong>正解說明</strong>${esc(q.explanation)}</p>
              ${q.evidence ? `<p class="explain evidence"><strong>🔎 稽核員下一步可查證</strong>${esc(q.evidence)}</p>` : ""}
              ${q.thinking ? `<p class="explain thinking"><strong>💡 進階稽核思維</strong>${esc(q.thinking)}</p>` : ""}
              ${q.practical ? `<p class="explain tip"><strong>實務稽核提醒</strong>${esc(q.practical)}</p>` : ""}
            </div>`;
        }).join("")}
      </section>`;

    document.getElementById("again").onclick = () => { showAuditStep1(); scrollTop(); };
  }

  // ============================================
  // 網址切換
  // ============================================
  function route() {
    const parts = location.hash.replace(/^#\/?/, "").split("/");
    const set = AUDIT_SETS.find(x => x.id === parts[0]);
    if (parts[0] === "clauses") showClauseIntro();
    else if (set) startAudit(set);
    else showHome();
    scrollTop();
  }

  window.addEventListener("hashchange", route);
  route();
})();

</script>
</body>
</html>
